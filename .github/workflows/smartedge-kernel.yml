# SmartEdge IIoT Gateway 内核编译工作流（arm64）
#
# 用法：
#   1. 放在 mrhuzi/raspberrypi-linux 仓库的 .github/workflows/ 目录
#      （提交到 smartedge-rpi-6.18.y 分支）
#   2. 手动触发完整编译：Actions 标签页 → "SmartEdge kernel build (arm64)" → Run workflow
#   3. 每次 push 到 smartedge-rpi-6.18.y 会自动运行【只有】快速设备树检查 (job: dtbs)
#
# 两个 job 的分工：
#   - dtbs  ：只编译设备树，2~5 分钟出结果。改 DT 的日常迭代跑这个。
#   - build ：完整内核编译（手动触发），冷构建 60~90 分钟 / ccache 热构建 10~20 分钟。
#
# 产物（Artifacts 下载后部署到 eMMC）：
#   - kernel8.img          ← arch/arm64/boot/Image（Phase 4 部署名）
#   - *.dtb                ← 设备树
#   - overlays/*.dtbo      ← overlay 二进制
#   - modules.tar.gz       ← 解压到目标板 /lib/modules

name: SmartEdge kernel build (arm64)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig to build"
        required: true
        default: "bcm2711_defconfig"
  push:
    branches:
      - smartedge-rpi-6.18.y

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "1"

jobs:
  # ---------------------------------------------------------------
  # 快速设备树校验：每次 push 自动运行，无需等完整编译
  # ---------------------------------------------------------------
  dtbs:
    name: Device tree check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install device tree tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex gcc device-tree-compiler

      - name: Build device trees (arm64)
        # DT 编译只需 cpp/dtc，不需要交叉工具链；
        # 但 kconfig 会检查 CROSS_COMPILE 指定的编译器是否存在，所以这里干脆不设。
        run: |
          make ARCH=arm64 bcm2711_defconfig
          make ARCH=arm64 dtbs -j"$(nproc)"

      - name: Check SmartEdge board device tree
        run: |
          set -e
          DTB=arch/arm64/boot/dts/broadcom/bcm2710-rpi-custom.dtb
          test -f "$DTB" || { echo "::error::$DTB was not built - check Makefile entry"; exit 1; }
          ls -l "$DTB"
          # 反编译抽查关键节点，避免"编译通过但节点没进去"的隐性错误
          dtc -I dtb -O dts "$DTB" -o smartedge.dts
          for node in "sc16is740@0" "mcp2515@1" "tpm_tis@2" "attiny@33" "gpio@43" "gpio@44" "rtc@51"; do
            grep -q "$node" smartedge.dts || { echo "::error::missing node: $node"; exit 1; }
            echo "ok: $node"
          done

      - name: Upload device trees
        uses: actions/upload-artifact@v4
        with:
          name: smartedge-dtbs
          path: arch/arm64/boot/dts/broadcom/bcm2710-rpi-custom.dtb
          retention-days: 7

  # ---------------------------------------------------------------
  # 完整内核编译：仅手动触发（避免每次 push 都烧 1 小时）
  # ---------------------------------------------------------------
  build:
    name: Build kernel (arm64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          df -h /

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev \
            python3 ccache zstd dwarves kmod

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # 不把 defconfig 放进 key：SmartEdge defconfig 与基线只差几个符号，
          # 共用同一份 ccache 能让首次 SmartEdge 构建复用基线结果（否则又是冷构建）
          key: ccache-arm64-${{ github.sha }}
          restore-keys: |
            ccache-arm64-

      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -z

      - name: Kernel config
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               ${{ inputs.defconfig || 'bcm2711_defconfig' }}

      - name: Build kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" -j"$(nproc)"
          ccache -s

      - name: Install modules
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               INSTALL_MOD_PATH="$PWD/staging" modules_install
          # build/source 符号链接指向构建机路径，目标板无用且会破坏 tar 包
          rm -f staging/lib/modules/*/build staging/lib/modules/*/source

      - name: Collect outputs
        run: |
          mkdir -p out/overlays
          cp arch/arm64/boot/Image out/kernel8.img
          cp arch/arm64/boot/dts/broadcom/bcm2710-rpi-3-b-plus.dtb out/
          # SmartEdge 定制设备树（Phase 1 起应该存在）
          if [ -f arch/arm64/boot/dts/broadcom/bcm2710-rpi-custom.dtb ]; then
            cp arch/arm64/boot/dts/broadcom/bcm2710-rpi-custom.dtb out/
          fi
          cp arch/arm64/boot/dts/overlays/*.dtbo out/overlays/
          tar -C staging -czf out/modules.tar.gz lib/modules
          ls -lh out out/overlays

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smartedge-kernel-${{ inputs.defconfig || 'bcm2711_defconfig' }}
          path: out/
          retention-days: 14
